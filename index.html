<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>আত-তুরাস একাডেমি — পেমেন্ট সিস্টেম</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Bengali:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --forest:      #2C4A2E;
  --forest-mid:  #3D6B40;
  --forest-lite: #E8F4E8;
  --gold:        #B8860B;
  --gold-light:  #D4A843;
  --gold-pale:   #FFF8E1;
  --cream:       #FAF6EF;
  --parchment:   #F0E8D8;
  --border:      #E0D4BC;
  --ink:         #1A1A14;
  --ink-soft:    #5A4A2E;
  --red:         #C0392B;
  --red-lite:    #FDECEA;
  --blue-lite:   #E3F2FD;
  --blue:        #1565C0;
  --shadow:      rgba(44,74,46,0.12);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{
  font-family:'Noto Serif Bengali',serif;
  background:var(--cream);
  color:var(--ink);
  min-height:100vh;
  display:flex;
  flex-direction:column;
  font-size:14px;
}
button{font-family:inherit;cursor:pointer;}
select,input{font-family:inherit;}
::-webkit-scrollbar{width:4px;}
::-webkit-scrollbar-thumb{background:var(--gold-light);border-radius:4px;}

/* ── HEADER ── */
.header{
  background:linear-gradient(135deg,var(--forest) 0%,var(--forest-mid) 100%);
  padding:13px 16px;
  display:flex;align-items:center;justify-content:space-between;
  box-shadow:0 2px 16px rgba(0,0,0,0.25);
  position:sticky;top:0;z-index:100;
}
.header-left{}
.header-arabic{font-size:11px;color:var(--gold-light);letter-spacing:1px;margin-bottom:1px;}
.header-title{font-size:18px;font-weight:700;color:#fff;line-height:1.2;}
.header-sub{font-size:10px;color:rgba(255,255,255,0.55);margin-top:1px;display:flex;align-items:center;gap:4px;}
.header-right{display:flex;align-items:center;gap:8px;}
.month-badge{background:rgba(255,255,255,0.12);border-radius:8px;padding:6px 10px;text-align:right;}
.month-badge-label{font-size:9px;color:var(--gold-light);}
.month-badge-value{font-size:13px;font-weight:700;color:#fff;}
.refresh-btn{
  background:rgba(255,255,255,0.15);border:none;border-radius:8px;
  padding:8px;display:flex;align-items:center;justify-content:center;
  transition:background 0.2s;
}
.refresh-btn:hover{background:rgba(255,255,255,0.25);}
.refresh-btn svg{transition:transform 0.4s;}
.refresh-btn.spinning svg{animation:spin 0.8s linear infinite;}

/* ── ERROR BANNER ── */
.error-banner{
  background:var(--red-lite);border-bottom:1px solid #F5C6C6;
  padding:9px 16px;display:flex;justify-content:space-between;align-items:center;
}
.error-banner span{font-size:12px;color:var(--red);}
.error-banner button{font-size:11px;background:var(--red);color:#fff;border:none;border-radius:6px;padding:4px 10px;}

/* ── NAV ── */
.nav{
  background:#fff;border-bottom:1px solid var(--border);
  display:flex;overflow-x:auto;padding:0 4px;
  -webkit-overflow-scrolling:touch;
}
.nav::-webkit-scrollbar{display:none;}
.nav-btn{
  display:flex;align-items:center;gap:4px;
  padding:10px 13px;border:none;background:none;
  font-size:12px;font-weight:600;color:#999;
  border-bottom:2.5px solid transparent;
  white-space:nowrap;transition:all 0.15s;
}
.nav-btn.active{color:var(--forest);border-bottom-color:var(--gold);}
.nav-btn svg{transition:stroke 0.15s;}

/* ── CONTENT ── */
.content{flex:1;padding:14px;max-width:680px;margin:0 auto;width:100%;}

/* ── CARDS ── */
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
.stat-card{border-radius:12px;padding:12px 14px;border:1px solid transparent;}
.stat-label{font-size:10px;color:#888;margin-bottom:3px;}
.stat-value{font-size:20px;font-weight:700;line-height:1.1;}
.stat-sub{font-size:10px;color:#aaa;margin-top:2px;}

/* ── WHITE CARD ── */
.card{background:#fff;border-radius:12px;padding:14px;border:1px solid var(--border);margin-bottom:12px;}
.card-title{font-size:13px;font-weight:700;color:var(--forest);margin-bottom:10px;}

/* ── PROGRESS ── */
.progress-bar-track{background:var(--parchment);border-radius:99px;height:9px;overflow:hidden;}
.progress-bar-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--forest),var(--gold-light));transition:width 0.6s ease;}
.progress-header{display:flex;justify-content:space-between;margin-bottom:8px;}
.progress-label{font-size:12px;font-weight:700;color:var(--forest);}
.progress-pct{font-size:12px;color:#888;}

/* ── STATUS ROW ── */
.status-row{display:flex;align-items:center;justify-content:space-between;padding:7px 0;border-bottom:1px solid #F5F0E8;}
.status-row:last-child{border-bottom:none;}
.status-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.status-name{font-size:13px;color:var(--ink);margin-left:7px;}
.status-right{display:flex;align-items:center;gap:6px;}
.status-amount{font-size:11px;color:#888;}
.badge{font-size:10px;font-weight:600;padding:2px 7px;border-radius:20px;}
.badge-paid{background:var(--forest-lite);color:var(--forest);}
.badge-due{background:var(--red-lite);color:var(--red);}
.badge-batch{background:var(--forest-lite);color:var(--forest);}
.badge-one{background:var(--gold-pale);color:var(--gold);}

/* ── LIST ITEMS ── */
.list-item{
  background:#fff;border-radius:12px;padding:13px 15px;
  margin-bottom:9px;border:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
}
.list-item.due-item{border-color:#F5C6C6;border-width:1.5px;}
.item-name{font-size:14px;font-weight:700;color:var(--ink);margin-bottom:3px;}
.item-meta{font-size:11px;color:#888;display:flex;flex-wrap:wrap;gap:8px;}
.item-note{font-size:11px;color:#aaa;margin-top:3px;}
.item-actions{display:flex;gap:6px;flex-shrink:0;}
.btn-icon{border-radius:7px;padding:6px 8px;display:flex;align-items:center;justify-content:center;border:1px solid;}
.btn-edit{background:#F5F0E8;border-color:var(--border);}
.btn-del{background:var(--red-lite);border-color:#F5C6C6;}

/* ── SECTION HEADER ── */
.section-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
.section-title{font-size:15px;font-weight:700;color:var(--forest);}
.section-sub{font-size:11px;color:#888;margin-top:1px;}

/* ── BUTTONS ── */
.btn-primary{
  display:flex;align-items:center;gap:5px;
  border:none;border-radius:8px;padding:8px 13px;
  font-size:12px;font-weight:600;color:#fff;
  transition:opacity 0.15s;
}
.btn-primary:active{opacity:0.8;}
.btn-green{background:var(--forest);}
.btn-gold{background:var(--gold);}
.btn-red-sm{font-size:10px;background:var(--forest);color:#fff;border:none;border-radius:6px;padding:4px 9px;}

/* ── MONTH SELECT ── */
.month-select-row{
  background:#fff;border-radius:10px;padding:9px 13px;
  margin-bottom:12px;border:1px solid var(--border);
  display:flex;align-items:center;gap:8px;
}
.month-select-row label{font-size:11px;color:#888;white-space:nowrap;}

/* ── INPUT/SELECT ── */
.field{margin-bottom:14px;}
.field label{font-size:12px;font-weight:600;color:var(--ink-soft);display:block;margin-bottom:4px;}
.field input,.field select{
  width:100%;padding:9px 12px;border-radius:8px;
  border:1.5px solid var(--border);background:#fff;
  font-family:inherit;font-size:14px;color:var(--ink);
  outline:none;transition:border-color 0.2s;
}
.field input:focus,.field select:focus{border-color:var(--gold);}

/* ── MODAL ── */
.modal-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,0.5);
  z-index:1000;display:flex;align-items:center;justify-content:center;padding:16px;
}
.modal-box{
  background:var(--cream);border-radius:16px;width:100%;max-width:480px;
  box-shadow:0 20px 60px rgba(0,0,0,0.3);border:1px solid var(--border);
  max-height:90vh;overflow-y:auto;
}
.modal-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:15px 18px;border-bottom:1px solid var(--parchment);
  position:sticky;top:0;background:var(--cream);z-index:1;
}
.modal-title{font-weight:700;font-size:15px;color:var(--forest);}
.modal-close{background:none;border:none;color:#aaa;padding:4px;line-height:0;}
.modal-body{padding:16px 18px;}
.modal-footer{display:flex;gap:8px;margin-top:4px;}
.btn-cancel{flex:1;padding:10px;border-radius:8px;border:1.5px solid var(--border);background:#fff;font-size:13px;color:#666;font-family:inherit;}
.btn-save{flex:2;padding:10px;border-radius:8px;border:none;font-size:13px;font-weight:700;color:#fff;display:flex;align-items:center;justify-content:center;gap:6px;font-family:inherit;transition:opacity 0.15s;}
.btn-save:active{opacity:0.8;}
.btn-save-green{background:var(--forest);}
.btn-save-gold{background:var(--gold);}

/* ── DUE SUMMARY ── */
.due-summary{
  background:var(--red-lite);border-radius:10px;padding:12px 15px;
  margin-bottom:12px;border:1px solid #F5C6C6;
  display:flex;justify-content:space-between;align-items:center;
}
.due-summary-label{font-size:12px;color:var(--red);font-weight:600;}
.due-summary-value{font-size:20px;font-weight:700;color:var(--red);}

/* ── HISTORY ── */
.history-detail{border-top:1px solid #F5F0E8;padding-top:8px;margin-top:8px;}
.history-row{display:flex;justify-content:space-between;font-size:11px;color:#666;padding:2px 0;}

/* ── EMPTY STATE ── */
.empty{text-align:center;padding:36px 20px;color:#bbb;background:#fff;border-radius:12px;border:1px solid var(--border);}
.empty-icon{font-size:28px;margin-bottom:8px;}
.empty-text{font-size:13px;}
.empty-success{background:var(--forest-lite);border-color:#A8D5A8;color:var(--forest);}
.empty-success .empty-text{font-weight:600;}

/* ── TOAST ── */
.toast{
  position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
  border-radius:10px;padding:10px 18px;font-size:13px;font-weight:600;color:#fff;
  box-shadow:0 4px 16px rgba(0,0,0,0.2);z-index:2000;white-space:nowrap;
  animation:fadeUp 0.3s ease;
}
.toast-success{background:var(--forest);}
.toast-error{background:var(--red);}

/* ── SYNC INDICATOR ── */
.sync-indicator{
  position:fixed;top:58px;right:10px;
  background:rgba(44,74,46,0.92);border-radius:8px;
  padding:5px 11px;display:flex;align-items:center;gap:5px;z-index:999;
}
.sync-text{font-size:11px;color:#fff;}

/* ── LOADING ── */
.loading-screen{
  min-height:100vh;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  background:var(--cream);
}
.loading-card{
  background:linear-gradient(135deg,var(--forest),var(--forest-mid));
  border-radius:16px;padding:32px 40px;text-align:center;
  box-shadow:0 8px 32px rgba(0,0,0,0.2);
}
.loading-arabic{font-size:13px;color:var(--gold-light);margin-bottom:6px;}
.loading-title{font-size:22px;font-weight:700;color:#fff;margin-bottom:20px;}
.loading-sub{font-size:12px;color:rgba(255,255,255,0.6);margin-top:12px;}

/* ── ANIMATIONS ── */
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeUp{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.5}}
.spinning{animation:spin 0.8s linear infinite;}
</style>
</head>

<script>
// ══════════════════════════════════════════════════
// CONFIG
// ══════════════════════════════════════════════════
const API_URL = "https://script.google.com/macros/s/AKfycbxbHOYabu1oEox8RtdDDT0oHbsT5nto43IlNr3Yae_CkdtQYiG5Vl9Qm6b4T9jxRHmsaw/exec";

// ══════════════════════════════════════════════════
// STATE
// ══════════════════════════════════════════════════
let students = [];
let payments = [];
let currentPage = "dashboard";
let selectedMonth = currentMonthKey();
let syncing = false;

// ══════════════════════════════════════════════════
// HELPERS
// ══════════════════════════════════════════════════
const MONTHS_BN = ["জানুয়ারি","ফেব্রুয়ারি","মার্চ","এপ্রিল","মে","জুন","জুলাই","আগস্ট","সেপ্টেম্বর","অক্টোবর","নভেম্বর","ডিসেম্বর"];

function currentMonthKey(){
  const n=new Date();
  return `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,"0")}`;
}
function monthLabel(m){
  const [y,mo]=m.split("-");
  return `${MONTHS_BN[parseInt(mo)-1]} ${y}`;
}
function fmtBDT(n){ return "৳"+Number(n||0).toLocaleString("bn-BD"); }
function uid(){ return Math.random().toString(36).slice(2,10); }
function strEq(a,b){ return String(a||"")===String(b||""); }

// ══════════════════════════════════════════════════
// API — fetch with redirect follow
// ══════════════════════════════════════════════════
async function callAPI(params){
  const url = new URL(API_URL);
  Object.entries(params).forEach(([k,v]) => url.searchParams.set(k, String(v)));
  const res = await fetch(url.toString(), {
    method: "GET",
    redirect: "follow",
  });
  const text = await res.text();
  // strip JSONP wrapper if present e.g. callback({...})
  const clean = text.replace(/^[^(]+\(/, "").replace(/\);?\s*$/, "");
  return JSON.parse(clean);
}

// ══════════════════════════════════════════════════
// LOAD DATA
// ══════════════════════════════════════════════════
async function loadData(){
  try {
    hideError();
    const res=await callAPI({action:"getAll"});
    if(res.error) throw new Error(res.error);
    students=res.students||[];
    payments=res.payments||[];
    renderPage();
  } catch(e){
    showError("ডেটা লোড হয়নি। ইন্টারনেট চেক করুন।");
    renderPage();
  }
}

async function refresh(){
  const btn=document.getElementById("refreshBtn");
  btn.classList.add("spinning");
  await loadData();
  btn.classList.remove("spinning");
}

// ══════════════════════════════════════════════════
// DERIVED DATA
// ══════════════════════════════════════════════════
function activeStudents(){ return students.filter(s=>String(s.active)==="true"); }
function monthPayments(m){ return payments.filter(p=>p.month===m); }
function paidSet(m){ return new Set(monthPayments(m).map(p=>String(p.studentId))); }
function totalCollected(m){ return monthPayments(m).reduce((s,p)=>s+Number(p.amount||0),0); }
function totalExpected(){ return activeStudents().reduce((s,st)=>s+Number(st.fee||0),0); }
function unpaidStudents(m){ const paid=paidSet(m); return activeStudents().filter(s=>!paid.has(String(s.id))); }
function totalDues(m){ return unpaidStudents(m).reduce((s,st)=>s+Number(st.fee||0),0); }
function allMonths(){
  const ms=[...new Set(payments.map(p=>p.month))];
  if(!ms.includes(currentMonthKey())) ms.push(currentMonthKey());
  return ms.sort((a,b)=>b.localeCompare(a));
}

// ══════════════════════════════════════════════════
// NAVIGATION
// ══════════════════════════════════════════════════
function goPage(p){
  currentPage=p;
  document.querySelectorAll(".nav-btn").forEach(b=>{
    b.classList.toggle("active",b.dataset.page===p);
  });
  renderPage();
}

function renderPage(){
  const el=document.getElementById("pageContent");
  if(currentPage==="dashboard") el.innerHTML=renderDashboard();
  else if(currentPage==="students") el.innerHTML=renderStudents();
  else if(currentPage==="payment") el.innerHTML=renderPayment();
  else if(currentPage==="dues") el.innerHTML=renderDues();
  else if(currentPage==="history") el.innerHTML=renderHistory();
}

// ══════════════════════════════════════════════════
// PAGES
// ══════════════════════════════════════════════════

function renderDashboard(){
  const m=currentMonthKey();
  const paid=paidSet(m);
  const collected=totalCollected(m);
  const expected=totalExpected();
  const dues=totalDues(m);
  const unpaid=unpaidStudents(m);
  const pct=expected>0?Math.min(100,Math.round(collected/expected*100)):0;
  const act=activeStudents();
  const mp=monthPayments(m);

  const statCards=[
    {label:"মোট সংগ্রহ",value:fmtBDT(collected),sub:monthLabel(m),color:"#2C4A2E",bg:"#E8F4E8"},
    {label:"বকেয়া",value:fmtBDT(dues),sub:`${unpaid.length} জন বাকি`,color:"#C0392B",bg:"#FDECEA"},
    {label:"পরিশোধিত",value:`${paid.size} জন`,sub:`মোট ${act.length} জন`,color:"#1565C0",bg:"#E3F2FD"},
    {label:"প্রত্যাশিত আয়",value:fmtBDT(expected),sub:"মাসিক মোট ফি",color:"#B8860B",bg:"#FFF8E1"},
  ];

  const statusRows=act.map(s=>{
    const isPaid=paid.has(String(s.id));
    const p=mp.find(x=>strEq(x.studentId,s.id));
    return `<div class="status-row">
      <div style="display:flex;align-items:center;">
        <div class="status-dot" style="background:${isPaid?"#2C4A2E":"#E74C3C"}"></div>
        <span class="status-name">${s.name}</span>
      </div>
      <div class="status-right">
        ${p?`<span class="status-amount">${fmtBDT(p.amount)}</span>`:""}
        <span class="badge ${isPaid?"badge-paid":"badge-due"}">${isPaid?"✓ দিয়েছেন":"বাকি"}</span>
      </div>
    </div>`;
  }).join("");

  return `
    <div class="stat-grid">
      ${statCards.map(c=>`
        <div class="stat-card" style="background:${c.bg};border-color:${c.color}22;">
          <div class="stat-label">${c.label}</div>
          <div class="stat-value" style="color:${c.color};">${c.value}</div>
          <div class="stat-sub">${c.sub}</div>
        </div>
      `).join("")}
    </div>
    <div class="card">
      <div class="progress-header">
        <span class="progress-label">সংগ্রহের অগ্রগতি</span>
        <span class="progress-pct">${pct}%</span>
      </div>
      <div class="progress-bar-track">
        <div class="progress-bar-fill" style="width:${pct}%"></div>
      </div>
    </div>
    <div class="card">
      <div class="card-title">${monthLabel(m)} — স্ট্যাটাস</div>
      ${act.length===0?'<div style="color:#bbb;font-size:12px;text-align:center;padding:16px;">কোনো স্টুডেন্ট নেই</div>':statusRows}
    </div>`;
}

function renderStudents(){
  const act=activeStudents();
  const m=currentMonthKey();
  const paid=paidSet(m);
  const mp=monthPayments(m);
  return `
    <div class="section-header">
      <div><div class="section-title">স্টুডেন্ট তালিকা</div></div>
      <button class="btn-primary btn-green" onclick="openStudentModal()">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        নতুন যোগ
      </button>
    </div>
    ${act.length===0?'<div class="empty"><div class="empty-icon">👥</div><div class="empty-text">কোনো স্টুডেন্ট নেই</div></div>':''}
    ${act.map(s=>{
      const isPaid=paid.has(String(s.id));
      const p=mp.find(x=>strEq(x.studentId,s.id));
      const fee=Number(s.fee||0);
      const paidAmt=Number(p?.amount||0);
      const remaining=fee-paidAmt;
      return `
      <div class="list-item" style="border-left:3px solid ${isPaid?"#2C4A2E":"#E74C3C"};">
        <div style="flex:1;">
          <div style="display:flex;align-items:center;gap:7px;margin-bottom:4px;">
            <span class="item-name">${s.name}</span>
            <span class="badge ${s.type==="batch"?"badge-batch":"badge-one"}">${s.type==="batch"?"ব্যাচ":"ওয়ান-টু-ওয়ান"}</span>
          </div>
          <div class="item-meta" style="margin-bottom:5px;">
            <span>মাসিক ফি: <b style="color:#2C4A2E;">${fmtBDT(fee)}</b></span>
            ${s.phone?`<span>📞 ${s.phone}</span>`:""}
          </div>
          <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;">
            ${isPaid
              ? `<span style="font-size:10px;font-weight:600;background:#E8F4E8;color:#2C4A2E;padding:2px 8px;border-radius:20px;">✓ ${monthLabel(m)} পরিশোধিত</span>
                 <span style="font-size:10px;color:#888;">${fmtBDT(paidAmt)}</span>`
              : `<span style="font-size:10px;font-weight:600;background:#FDECEA;color:#C0392B;padding:2px 8px;border-radius:20px;">বাকি আছে</span>
                 <span style="font-size:11px;font-weight:700;color:#C0392B;">${fmtBDT(remaining)}</span>`
            }
          </div>
        </div>
        <div class="item-actions">
          <button class="btn-icon btn-edit" onclick='openStudentModal(${JSON.stringify(s)})'>
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#B8860B" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
          </button>
          <button class="btn-icon btn-del" onclick="delStudent('${s.id}','${s.name.replace(/'/g,"\\'")}')">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#C0392B" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/></svg>
          </button>
        </div>
      </div>`;
    }).join("")}`;
}

function renderPayment(){
  const mp=monthPayments(selectedMonth);
  const monthOpts=allMonths().map(m=>`<option value="${m}" ${m===selectedMonth?"selected":""}>${monthLabel(m)}</option>`).join("");
  const rows=mp.map(p=>{
    const st=students.find(s=>strEq(s.id,p.studentId));
    return `
      <div class="list-item">
        <div>
          <div class="item-name">${st?.name||"—"}</div>
          <div class="item-meta">
            <span>💰 ${fmtBDT(p.amount)}</span>
            <span>📱 ${p.method}</span>
            ${p.trxId?`<span>🔖 ${p.trxId}</span>`:""}
          </div>
          ${p.note?`<div class="item-note">📝 ${p.note}</div>`:""}
        </div>
        <button class="btn-icon btn-del" onclick="delPayment('${p.id}')">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#C0392B" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/></svg>
        </button>
      </div>`;
  }).join("");

  return `
    <div class="section-header">
      <div>
        <div class="section-title">পেমেন্ট এন্ট্রি</div>
        <div class="section-sub">${monthLabel(selectedMonth)}</div>
      </div>
      <button class="btn-primary btn-gold" onclick="openPaymentModal()">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        পেমেন্ট যোগ
      </button>
    </div>
    <div class="month-select-row">
      <label>মাস:</label>
      <select onchange="selectedMonth=this.value;renderPage()" style="flex:1;padding:7px 10px;border-radius:8px;border:1.5px solid var(--border);font-family:inherit;font-size:13px;outline:none;">
        ${monthOpts}
      </select>
    </div>
    ${mp.length===0?'<div class="empty"><div class="empty-icon">📋</div><div class="empty-text">এই মাসে কোনো পেমেন্ট নেই</div></div>':rows}`;
}

function renderDues(){
  const unpaid=unpaidStudents(selectedMonth);
  const dues=totalDues(selectedMonth);
  const monthOpts=allMonths().map(m=>`<option value="${m}" ${m===selectedMonth?"selected":""}>${monthLabel(m)}</option>`).join("");

  return `
    <div class="section-header">
      <div>
        <div class="section-title">বকেয়া তালিকা</div>
        <div class="section-sub">${monthLabel(selectedMonth)}</div>
      </div>
    </div>
    <div class="due-summary">
      <span class="due-summary-label">মোট বকেয়া</span>
      <span class="due-summary-value">${fmtBDT(dues)}</span>
    </div>
    <div class="month-select-row">
      <label>মাস:</label>
      <select onchange="selectedMonth=this.value;renderPage()" style="flex:1;padding:7px 10px;border-radius:8px;border:1.5px solid var(--border);font-family:inherit;font-size:13px;outline:none;">
        ${monthOpts}
      </select>
    </div>
    ${unpaid.length===0
      ? '<div class="empty empty-success"><div class="empty-icon">✅</div><div class="empty-text">সবাই পরিশোধ করেছেন!</div></div>'
      : unpaid.map(s=>`
          <div class="list-item due-item">
            <div>
              <div class="item-name">${s.name}</div>
              <div class="item-meta"><span>${s.type==="batch"?"ব্যাচ":"ওয়ান-টু-ওয়ান"}</span></div>
            </div>
            <div style="text-align:right;">
              <div style="font-size:16px;font-weight:700;color:var(--red);margin-bottom:4px;">${fmtBDT(s.fee)}</div>
              <button class="btn-red-sm" onclick="openPaymentModal('${s.id}')">পেমেন্ট নিন</button>
            </div>
          </div>`).join("")}`;
}

function renderHistory(){
  const months=allMonths();
  if(months.length===0) return '<div class="empty"><div class="empty-icon">📅</div><div class="empty-text">কোনো রেকর্ড নেই</div></div>';

  return `
    <div class="section-title" style="margin-bottom:14px;">মাসিক ইতিহাস</div>
    ${months.map(m=>{
      const mp=monthPayments(m);
      const total=mp.reduce((s,p)=>s+Number(p.amount||0),0);
      const paidCount=new Set(mp.map(p=>p.studentId)).size;
      const rows=mp.map(p=>{
        const st=students.find(s=>strEq(s.id,p.studentId));
        return `<div class="history-row">
          <span>${st?.name||"—"}</span>
          <span style="display:flex;gap:8px;">
            <span style="color:#aaa;">${p.method}</span>
            <span style="font-weight:600;color:#2C4A2E;">${fmtBDT(p.amount)}</span>
          </span>
        </div>`;
      }).join("");

      return `<div class="card" style="margin-bottom:10px;">
        <div style="display:flex;justify-content:space-between;align-items:center;${mp.length>0?"margin-bottom:0;":""}">
          <div>
            <div style="font-size:14px;font-weight:700;color:#2C4A2E;">${monthLabel(m)}</div>
            <div style="font-size:11px;color:#888;margin-top:2px;">${paidCount} জন পরিশোধ করেছেন</div>
          </div>
          <div style="font-size:18px;font-weight:700;color:#B8860B;">${fmtBDT(total)}</div>
        </div>
        ${mp.length>0?`<div class="history-detail">${rows}</div>`:""}
      </div>`;
    }).join("")}`;
}

// ══════════════════════════════════════════════════
// MODALS
// ══════════════════════════════════════════════════
function openStudentModal(student){
  const isEdit=!!student;
  document.getElementById("modalTitle").textContent=isEdit?"স্টুডেন্ট সম্পাদনা":"নতুন স্টুডেন্ট";
  document.getElementById("modalBody").innerHTML=`
    <div class="field"><label>নাম</label><input id="sName" value="${isEdit?student.name:""}" placeholder="পূর্ণ নাম"/></div>
    <div class="field"><label>ধরন</label>
      <select id="sType">
        <option value="one2one" ${(!isEdit||student.type==="one2one")?"selected":""}>ওয়ান-টু-ওয়ান</option>
        <option value="batch" ${isEdit&&student.type==="batch"?"selected":""}>ব্যাচ</option>
      </select>
    </div>
    <div class="field"><label>মাসিক ফি (টাকা)</label><input id="sFee" type="number" value="${isEdit?student.fee:""}" placeholder="0"/></div>
    <div class="field"><label>ফোন নম্বর</label><input id="sPhone" value="${isEdit?student.phone:""}" placeholder="01XXXXXXXXX"/></div>
    <div class="field"><label>ভর্তির তারিখ</label><input id="sJoin" type="date" value="${isEdit?student.joinDate:new Date().toISOString().slice(0,10)}"/></div>
    <div class="modal-footer">
      <button class="btn-cancel" onclick="closeModal()">বাতিল</button>
      <button class="btn-save btn-save-green" onclick="submitStudent(${isEdit?`'${student.id}'`:null})">সংরক্ষণ করুন</button>
    </div>`;
  document.getElementById("modalOverlay").style.display="flex";
}

function openPaymentModal(prefillId){
  const act=activeStudents();
  const opts=act.map(s=>`<option value="${s.id}" ${strEq(s.id,prefillId)?"selected":""}>${s.name}</option>`).join("");
  const monthOpts=allMonths().map(m=>`<option value="${m}" ${m===currentMonthKey()?"selected":""}>${monthLabel(m)}</option>`).join("");

  document.getElementById("modalTitle").textContent="পেমেন্ট রেকর্ড করুন";
  document.getElementById("modalBody").innerHTML=`
    <div class="field"><label>স্টুডেন্ট</label>
      <select id="pStudent" onchange="autoFillFee()">${opts}</select>
    </div>
    <div class="field"><label>মাস</label><select id="pMonth">${monthOpts}</select></div>
    <div class="field"><label>পরিমাণ (টাকা)</label><input id="pAmount" type="number" placeholder="0"/></div>
    <div class="field"><label>পেমেন্ট মাধ্যম</label>
      <select id="pMethod">
        <option>bKash</option><option>Nagad</option><option>নগদ হাতে</option><option>অন্যান্য</option>
      </select>
    </div>
    <div class="field"><label>ট্রানজেকশন আইডি (ঐচ্ছিক)</label><input id="pTrx" placeholder="TXN123..."/></div>
    <div class="field"><label>নোট (ঐচ্ছিক)</label><input id="pNote" placeholder="যেকোনো মন্তব্য"/></div>
    <div class="modal-footer">
      <button class="btn-cancel" onclick="closeModal()">বাতিল</button>
      <button class="btn-save btn-save-gold" onclick="submitPayment()">পেমেন্ট সংরক্ষণ</button>
    </div>`;
  document.getElementById("modalOverlay").style.display="flex";
  setTimeout(autoFillFee,50);
}

function autoFillFee(){
  const sid=document.getElementById("pStudent")?.value;
  const s=students.find(x=>strEq(x.id,sid));
  if(s?.fee) document.getElementById("pAmount").value=s.fee;
}

function closeModal(){ document.getElementById("modalOverlay").style.display="none"; }
function closeModalOnOverlay(e){ if(e.target===document.getElementById("modalOverlay")) closeModal(); }

// ══════════════════════════════════════════════════
// SUBMIT
// ══════════════════════════════════════════════════
async function submitStudent(existingId){
  const name=document.getElementById("sName").value.trim();
  if(!name){ alert("নাম দিন"); return; }
  const data={
    id: existingId||uid(),
    name,
    type: document.getElementById("sType").value,
    fee: Number(document.getElementById("sFee").value)||0,
    phone: document.getElementById("sPhone").value.trim(),
    joinDate: document.getElementById("sJoin").value,
    active: "true"
  };
  closeModal();
  setSyncing(true);
  try{
    const res=await callAPI({action:"saveStudent",data:JSON.stringify(data)});
    if(res.error) throw new Error(res.error);
    await loadData();
    showToast(existingId?"তথ্য আপডেট হয়েছে ✓":`${name} যোগ হয়েছে ✓`);
  } catch{ showToast("সমস্যা হয়েছে","error"); }
  setSyncing(false);
}

async function submitPayment(){
  const sid=document.getElementById("pStudent").value;
  const amount=document.getElementById("pAmount").value;
  if(!sid){ alert("স্টুডেন্ট বেছে নিন"); return; }
  if(!amount){ alert("পরিমাণ দিন"); return; }
  const data={
    id: uid(),
    studentId: String(sid),
    month: document.getElementById("pMonth").value,
    amount: Number(amount),
    method: document.getElementById("pMethod").value,
    trxId: document.getElementById("pTrx").value.trim(),
    note: document.getElementById("pNote").value.trim(),
    createdAt: new Date().toISOString()
  };
  closeModal();
  setSyncing(true);
  try{
    const res=await callAPI({action:"savePayment",data:JSON.stringify(data)});
    if(res.error) throw new Error(res.error);
    await loadData();
    showToast("পেমেন্ট সংরক্ষিত হয়েছে ✓");
  } catch{ showToast("সমস্যা হয়েছে","error"); }
  setSyncing(false);
}

async function delStudent(id,name){
  if(!confirm(`"${name}" মুছে ফেলবেন?`)) return;
  setSyncing(true);
  try{
    await callAPI({action:"deleteStudent",id});
    await loadData();
    showToast("মুছে ফেলা হয়েছে","error");
  } catch{ showToast("সমস্যা হয়েছে","error"); }
  setSyncing(false);
}

async function delPayment(id){
  if(!confirm("এই পেমেন্ট মুছে ফেলবেন?")) return;
  setSyncing(true);
  try{
    await callAPI({action:"deletePayment",id});
    await loadData();
    showToast("পেমেন্ট মুছে ফেলা হয়েছে","error");
  } catch{ showToast("সমস্যা হয়েছে","error"); }
  setSyncing(false);
}

// ══════════════════════════════════════════════════
// UI HELPERS
// ══════════════════════════════════════════════════
let toastTimer=null;
function showToast(msg,type="success"){
  const el=document.getElementById("toast");
  el.textContent=msg;
  el.className=`toast toast-${type}`;
  el.style.display="block";
  if(toastTimer) clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>el.style.display="none",3000);
}

function setSyncing(v){
  syncing=v;
  document.getElementById("syncIndicator").style.display=v?"flex":"none";
}

function showError(msg){
  const b=document.getElementById("errorBanner");
  document.getElementById("errorMsg").textContent=msg;
  b.style.display="flex";
}
function hideError(){ document.getElementById("errorBanner").style.display="none"; }

// ══════════════════════════════════════════════════
// INIT
// ══════════════════════════════════════════════════
document.getElementById("currentMonthBadge").textContent=monthLabel(currentMonthKey());

(async()=>{
  await loadData();
  document.getElementById("loadingScreen").style.display="none";
  const app=document.getElementById("app");
  app.style.display="flex";
})();
</script>
